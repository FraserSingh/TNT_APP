[project]
name = "tnt-app"
author = "Fraser Singh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "commitizen>=4.13.6",
    "flask>=3.1.2",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "pre-commit>=4.5.1",
    "werkzeug>=3.1.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # import sorting (replaces isort)
]

ignore = [
  "E203",  # black compatibility
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
