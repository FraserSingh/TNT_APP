<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}TNT Rota{% endblock %}</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="font-semibold text-lg">TNT Rota</div>

        <div class="space-x-4">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('rota.rota') }}" class="text-gray-600 hover:text-black">Rota</a>

                {% if current_user.role == 'admin' %}
                    <a href="{{ url_for('admin.users') }}" class="text-gray-600 hover:text-black">Users</a>
                    <a href="{{ url_for('admin.stores') }}" class="text-gray-600 hover:text-black">Stores</a>
                    <a href="{{ url_for('rota.admin_summary') }}" class="text-gray-600 hover:text-black">Dashboard</a>
                {% endif %}

                <a href="{{ url_for('auth.logout') }}" class="text-red-500 hover:text-red-700">
                    Logout
                </a>
            {% endif %}
        </div>
    </nav>

    <main class="p-8 max-w-7xl mx-auto">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
