{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="mx-auto max-w-md space-y-6">
    <h1 class="text-2xl font-bold text-gray-900">Login</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="space-y-2">
                {% for message in messages %}
                    <div class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="rounded-lg bg-white p-6 shadow">
        <form method="POST" class="space-y-4">
            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Login</button>
        </form>
    </div>
</div>
{% endblock %}
